<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="description" content="Tra cứu thửa đất & quy hoạch Xã Nhựt Tảo, Tây Ninh">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://mt1.google.com https://*.basemaps.cartocdn.com; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <title>WebGIS · Nhựt Tảo</title>
  <link rel="stylesheet" href="lib/ol.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div id="map" role="application" aria-label="Bản đồ thửa đất"></div>

    <div id="loading" class="loading-overlay">
      <div class="spinner"></div>
      <div class="loading-brand">Nhựt Tảo</div>
      <div>Đang tải dữ liệu thửa đất…</div>
    </div>

    <div id="toast" class="toast" role="status"></div>

    <a class="logo-badge" href="index.html" title="Về trang giới thiệu">
      NT
      <span>WebGIS</span>
    </a>

    <!-- Top search capsule -->
    <div class="search-bar" id="sidebar">
      <div class="search-bar-row">
        <div class="tabs">
          <button type="button" class="active" data-tab="tothua">Tờ/thửa</button>
          <button type="button" data-tab="owner">Chủ SD</button>
          <button type="button" data-tab="coord">Tọa độ</button>
        </div>
        <div class="search-fields">
          <div class="search-box active" id="search-tothua">
            <input type="text" id="inp-tothua" maxlength="30" autocomplete="off" placeholder="Nhập số tờ_số thửa…">
          </div>
          <div class="search-box" id="search-owner" style="display:none">
            <input type="text" id="inp-owner" maxlength="80" autocomplete="off" placeholder="Tên chủ sử dụng…">
          </div>
          <div class="search-extra" id="search-coord">
            <input type="text" id="inp-x" inputmode="decimal" maxlength="20" autocomplete="off" placeholder="X (kinh độ)">
            <input type="text" id="inp-y" inputmode="decimal" maxlength="20" autocomplete="off" placeholder="Y (vĩ độ)">
          </div>
        </div>
        <button type="button" class="btn-search" id="btn-search-go" title="Tìm kiếm" aria-label="Tìm kiếm">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </button>
      </div>
      <div id="suggest-tothua" class="suggest-list"></div>
      <div id="suggest-owner" class="suggest-list"></div>
    </div>

    <!-- Một khung thông tin gọn -->
    <div class="info-panel">
      <div class="info-card">
        <div id="empty-state" class="empty-state">
          <div class="empty-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 110-5 2.5 2.5 0 010 5z"/></svg>
          </div>
          <h2>Chưa chọn thửa</h2>
          <p>Gõ tờ/thửa để xem gợi ý, hoặc chạm một thửa trên bản đồ.</p>
        </div>

        <div id="info-content" class="info-content">
          <div id="block-thua" class="info-section"></div>
          <div id="block-ratio" class="info-section ratio-section" style="display:none"></div>
          <div id="block-qh" class="info-section"></div>
          <div class="info-actions">
            <button type="button" id="btn-copy" disabled>
              <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
              Sao chép
            </button>
            <button type="button" id="btn-direction" disabled>
              <svg viewBox="0 0 24 24"><path d="M21.71 11.29l-9-9a.996.996 0 00-1.41 0l-9 9a.996.996 0 000 1.41l9 9c.39.39 1.02.39 1.41 0l9-9a.996.996 0 000-1.41zM14 14.5V12h-4v3H8v-4c0-.55.45-1 1-1h5V7.5l3.5 3.5-3.5 3.5z"/></svg>
              Chỉ đường
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom tool dock — icon style theo bộ minh họa -->
    <div class="toolbar" role="toolbar" aria-label="Công cụ bản đồ">
      <!-- Nhóm: Lớp -->
      <button type="button" class="tool-btn" id="btn-layers" title="Lớp &amp; nền bản đồ" aria-label="Lớp bản đồ">
        <svg viewBox="0 0 48 48" aria-hidden="true" class="icon-color">
          <path fill="#0B6E99" d="M10 32l14 8 14-8-14-8-14 8z"/>
          <path fill="#1496C8" d="M10 24l14 8 14-8-14-8-14 8z"/>
          <path fill="#3DC4F5" d="M10 16l14 8 14-8-14-8-14 8z"/>
        </svg>
      </button>

      <span class="tool-sep" aria-hidden="true"></span>

      <!-- Nhóm: Định vị / Reset -->
      <button type="button" class="tool-btn" id="btn-locate" title="Định vị GPS" aria-label="Định vị GPS">
        <svg viewBox="0 0 48 48" aria-hidden="true" class="icon-color">
          <path fill="#1AA3D8" d="M24 6c-6.6 0-12 5.2-12 11.6 0 8.7 10.2 19.6 11.1 20.5a1.3 1.3 0 0 0 1.8 0C25.8 37.2 36 26.3 36 17.6 36 11.2 30.6 6 24 6z"/>
          <circle fill="#0B4F6C" cx="24" cy="17.5" r="4.2"/>
          <path fill="none" stroke="#1AA3D8" stroke-width="2.4" stroke-linecap="round" d="M15.5 30.5c2.6 2.2 5.4 3.4 8.5 3.4s5.9-1.2 8.5-3.4"/>
        </svg>
      </button>
      <button type="button" class="tool-btn" id="btn-reset" title="Về phạm vi mặc định" aria-label="Reset bản đồ">
        <svg viewBox="0 0 48 48" aria-hidden="true" class="icon-color">
          <path fill="none" stroke="#0B4F6C" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"
            d="M10 22 L24 10 L38 22 V38 H28 V28 H20 V38 H10 Z"/>
          <rect x="21.5" y="30" width="5" height="8" rx="1" fill="#0B4F6C"/>
        </svg>
      </button>

      <span class="tool-sep" aria-hidden="true"></span>

      <!-- Nhóm: Đo đạc -->
      <button type="button" class="tool-btn" id="btn-measure-line" data-tool="LineString" title="Đo khoảng cách" aria-label="Đo khoảng cách">
        <svg viewBox="0 0 48 48" aria-hidden="true" class="icon-color">
          <g transform="rotate(-28 24 24)">
            <rect x="6" y="18" width="36" height="12" rx="3" fill="none" stroke="#1496C8" stroke-width="2.6"/>
            <path stroke="#1496C8" stroke-width="2" stroke-linecap="round" d="M12 18v5M16 18v3.5M20 18v5M24 18v3.5M28 18v5M32 18v3.5M36 18v5"/>
          </g>
        </svg>
      </button>
      <button type="button" class="tool-btn" id="btn-measure-area" data-tool="Polygon" title="Đo diện tích" aria-label="Đo diện tích">
        <svg viewBox="0 0 48 48" aria-hidden="true" class="icon-color">
          <rect x="12" y="12" width="24" height="24" fill="none" stroke="#1AA3D8" stroke-width="1.8" stroke-dasharray="3.5 2.5"/>
          <path fill="none" stroke="#1AA3D8" stroke-width="2.4" stroke-linecap="round"
            d="M12 18V12h6M30 12h6v6M36 30v6h-6M18 36H12v-6"/>
          <path stroke="#1AA3D8" stroke-width="1.4" stroke-dasharray="2.5 2" d="M20 12v24M28 12v24M12 20h24M12 28h24"/>
        </svg>
      </button>
      <button type="button" class="tool-btn tool-btn-danger" id="btn-measure-clear" title="Xóa đo đạc" aria-label="Xóa đo đạc">
        <svg viewBox="0 0 48 48" aria-hidden="true" class="icon-color">
          <path fill="none" stroke="#0B4F6C" stroke-width="2.6" stroke-linejoin="round"
            d="M16 18h16l-1.2 18H17.2L16 18z"/>
          <path fill="none" stroke="#0B4F6C" stroke-width="2.6" stroke-linecap="round"
            d="M14 18h20M20 18V14h8v4"/>
          <path stroke="#E11D48" stroke-width="2.4" stroke-linecap="round" d="M21 24v8M27 24v8"/>
          <rect x="20" y="12" width="8" height="3" rx="1" fill="#64748B"/>
        </svg>
      </button>
    </div>

    <div id="layer-popover" class="layer-popover">
      <h3>Lớp dữ liệu</h3>
      <div class="layer-row">
        <input type="checkbox" id="chk-parcel" checked>
        <label for="chk-parcel">Thửa đất</label>
        <input type="range" id="opacity-parcel" min="0" max="100" value="85" aria-label="Độ mờ thửa">
      </div>
      <div class="layer-row" style="margin-top:10px">
        <input type="checkbox" id="chk-planning" checked>
        <label for="chk-planning">Quy hoạch</label>
        <input type="range" id="opacity-planning" min="0" max="100" value="55" aria-label="Độ mờ QH">
      </div>
      <h3 style="margin-top:12px">Tờ bản đồ</h3>
      <div class="sheet-tools">
        <button type="button" id="btn-sheet-all">Chọn tất cả</button>
        <button type="button" id="btn-sheet-none">Bỏ chọn</button>
      </div>
      <input type="text" id="sheet-filter" placeholder="Lọc số tờ…" maxlength="10" autocomplete="off">
      <div id="sheet-list"></div>
      <h3 style="margin-top:12px">Nền bản đồ</h3>
      <div class="basemap-row">
        <button type="button" class="active" data-base="satellite">Vệ tinh</button>
        <button type="button" data-base="street">Đường phố</button>
        <button type="button" data-base="terrain">Địa hình</button>
      </div>
    </div>

    <div class="zoom-cluster">
      <button type="button" id="btn-zoom-in" aria-label="Phóng to">+</button>
      <button type="button" id="btn-zoom-out" aria-label="Thu nhỏ">−</button>
    </div>

    <div id="coord-hud" class="coord-hud" aria-live="polite"></div>
    <div id="measure-result" class="measure-result"></div>
    <div id="disclaimer" class="disclaimer"></div>
  </div>

  <script src="lib/ol.js"></script>
  <script src="js/config.js"></script>
  <script src="js/style_aggregated.js"></script>
  <script src="data/Aggregated_1.js"></script>
  <script src="data/VungNhutTao_2.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
